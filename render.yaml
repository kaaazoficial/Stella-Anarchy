services:
  - type: web
    name: stella-anarchy
    runtime: python
    repo: https://github.com/kaaazoficial/Stella-Anarchy
    branch: main
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
