name: Anarchy Worker checks

on:
  push:
    branches: [main]
    paths:
      - "anarchy-worker/**"
      - ".github/workflows/anarchy-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "anarchy-worker/**"
      - ".github/workflows/anarchy-worker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anarchy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
